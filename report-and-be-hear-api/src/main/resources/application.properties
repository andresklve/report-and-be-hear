spring.application.name=reportandbeheard

# Configuracion propia de cada PC (usuario, contrasena, puerto de PostgreSQL).
# Copie local.properties.example como local.properties en esta carpeta y complete sus datos.
# local.properties no se sube a git. Si no existe, se usan los valores de abajo.
spring.config.import=optional:file:./local.properties

spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/BDReportAndBeHeard}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
server.port=8084

# Clave para firmar el JWT (HS512 necesita al menos 64 caracteres).
# Esta es solo para desarrollo: en produccion se define la variable JWT_SECRET.
jwt.secret=${JWT_SECRET:reclamaya-dev-3a58b70d3be31bfcc07aa44f9f9cda10bc6ceb3c4107da266d6a9ee385ba6c9989f173533c5b5d3b5905ac36450299be}
