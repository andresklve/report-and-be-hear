spring.application.name=reportandbeheard

# Configuracion propia de cada PC (usuario, contrasena, puerto de PostgreSQL).
# Copie local.properties.example como local.properties en esta carpeta y complete sus datos.
# local.properties no se sube a git. Si no existe, se usan los valores de abajo.
spring.config.import=optional:file:./local.properties

spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/BDReportAndBeHeard}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
server.port=8084

# schema.sql migra bases antiguas (correo -> username) antes de que Hibernate actualice las tablas
spring.sql.init.mode=always
spring.sql.init.separator=^^^END^^^

# Clave para firmar el JWT (HS512 necesita al menos 64 caracteres).
# Esta es solo para desarrollo: en produccion se define la variable JWT_SECRET.
jwt.secret=${JWT_SECRET:reclamaya-dev-3a58b70d3be31bfcc07aa44f9f9cda10bc6ceb3c4107da266d6a9ee385ba6c9989f173533c5b5d3b5905ac36450299be}

# IA para clasificar reclamos (Google Gemini, API REST de Google AI Studio).
# La clave va en local.properties (no se sube a git) o en la variable de entorno GEMINI_API_KEY.
# Sin clave, la clasificacion usa reglas por palabras clave.
gemini.api.key=${GEMINI_API_KEY:}
# Modelos en orden de preferencia (si uno esta saturado se usa el siguiente)
gemini.models=${GEMINI_MODELS:gemini-3.5-flash-lite,gemini-flash-lite-latest,gemini-3.8-flash}

# ---- Correos (olvide mi contrasena y avisos de reportes) ----
# Sin spring.mail.host los correos solo se muestran en la consola (y el enlace de "olvide mi contrasena"
# aparece en pantalla). Para correo REAL con Gmail pon esto en local.properties (no se sube a git):
#   spring.mail.host=smtp.gmail.com
#   spring.mail.port=587
#   spring.mail.username=tucorreo@gmail.com
#   spring.mail.password=xxxxxxxxxxxxxxxx   <- "contrasena de aplicacion" de Google (16 letras)
#   spring.mail.properties.mail.smtp.auth=true
#   spring.mail.properties.mail.smtp.starttls.enable=true
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.password-reset.minutes=30
# Remitente: la misma cuenta del SMTP (Gmail no permite enviar como otra direccion)
app.mail.from=${MAIL_FROM:${spring.mail.username:no-reply@reclamaya.pe}}
app.mail.from-name=ReclamaYA
app.mail.demo=${MAIL_DEMO:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
