<mat-form-field class="rango">
  <mat-label>{{ etiqueta }}</mat-label>
  <mat-date-range-input [rangePicker]="picker">
    <input matStartDate placeholder="Desde" [value]="desde()" (dateChange)="desde.set($event.value)" />
    <input matEndDate placeholder="Hasta" [value]="hasta()" (dateChange)="hasta.set($event.value)" />
  </mat-date-range-input>
  @if (desde() || hasta()) {
    <button matIconButton matSuffix type="button" (click)="limpiar()" aria-label="Quitar filtro de fechas"><mat-icon>close</mat-icon></button>
  }
  <mat-datepicker-toggle matIconSuffix [for]="picker" />
  <mat-date-range-picker #picker />
</mat-form-field>
