@if (info().paso === 0) {
  <div class="track track-descartado" [class.compacto]="compacto()">
    <span class="ms">block</span> Descartado
  </div>
} @else {
  <ol class="track" [class.compacto]="compacto()" [attr.aria-label]="'Estado: ' + info().label">
    @for (p of pasos; track p; let i = $index) {
      <li [class.hecho]="i < info().paso" [class.actual]="i === info().paso - 1">
        <span class="track-dot"></span>
        @if (!compacto()) { <span class="track-lbl">{{ p }}</span> }
      </li>
    }
  </ol>
}
