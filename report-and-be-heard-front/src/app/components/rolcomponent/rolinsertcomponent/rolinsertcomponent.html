<a matButton routerLink="/panel/roles/listar" class="volver"><mat-icon>arrow_back</mat-icon>Roles</a>
<mat-card appearance="outlined" class="form-panel">
  <mat-card-header>
    <div mat-card-avatar class="form-ico"><mat-icon>badge</mat-icon></div>
    <mat-card-title>Registro de Rol</mat-card-title>
    <mat-card-subtitle>Perfiles de acceso. El sistema usa ADMINISTRADOR, MUNICIPALIDAD y CIUDADANO.</mat-card-subtitle>
  </mat-card-header>
  <form [formGroup]="rolForm" (ngSubmit)="insertarRol()">
    <mat-card-content class="form-grid">
      <mat-form-field class="campo-full">
        <mat-label>Nombre del rol</mat-label>
        <input matInput placeholder="MUNICIPALIDAD" formControlName="nombre">
        <mat-error>Campo obligatorio.</mat-error>
      </mat-form-field>
      <mat-form-field class="campo-full">
        <mat-label>Descripción (opcional)</mat-label>
        <input matInput placeholder="Atiende y modera los testimonios" formControlName="descripcion">
      </mat-form-field>
      @if(mensaje){
      <p class="alerta campo-full"><mat-icon>info</mat-icon>{{ mensaje }}</p>
      }
    </mat-card-content>
    <mat-card-actions class="form-acciones">
      <a matButton routerLink="/panel/roles/listar">Cancelar</a>
      <span class="spacer"></span>
      <button matButton="filled" type="submit">Registrar</button>
    </mat-card-actions>
  </form>
</mat-card>
